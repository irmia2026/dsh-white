<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Dsh-white</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #101418; color: #8a94a0; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(180deg, #1b2a5e, #4d6bfe);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 30px; font-weight: 700; margin-bottom: 22px;
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #2a323d; border-top-color: #4d8bff;
    animation: spin 0.9s linear infinite; margin: 14px auto 0;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .title { color: #d7dde3; font-size: 15px; }
  .hint { margin-top: 6px; font-size: 12px; }
</style>
</head>
<body>
  <div class="logo">白</div>
  <div class="title">Dsh-white 正在启动</div>
  <div class="hint">首次运行需要初始化运行时，约 20 秒；之后秒开。</div>
  <div class="spinner"></div>
</body>
</html>
