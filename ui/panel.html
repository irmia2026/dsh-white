<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepHarness 状态</title>
<style>
  :root {
    --bg: #101418; --panel: #171c22; --border: #262d36;
    --text: #d7dde3; --muted: #8a94a0; --accent: #4d8bff;
    --ok: #3fb96f; --warn: #e0a63c; --err: #e05656;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; gap: 4px; padding: 8px 12px 0;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header button {
    background: none; border: none; color: var(--muted);
    padding: 8px 14px; cursor: pointer; font-size: 13px;
    border-bottom: 2px solid transparent;
  }
  header button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  section { flex: 1; overflow-y: auto; padding: 16px; display: none; }
  section.active { display: block; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .card h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e242c; }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .badge.idle { background: #232a33; color: var(--muted); }
  .badge.starting, .badge.restarting { background: #3a3320; color: var(--warn); }
  .badge.ready { background: #1d3527; color: var(--ok); }
  .badge.failed { background: #3a2020; color: var(--err); }

  #log { font: 11.5px/1.55 Consolas, "Courier New", monospace; white-space: pre-wrap; word-break: break-all; background: #0c0f13; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: calc(100vh - 130px); overflow-y: auto; }
  #log .dim { color: #4a5560; }
  #log .err { color: var(--err); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .toolbar button, .card button {
    background: #232b36; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px;
  }
  .toolbar button:hover, .card button:hover { background: #2b3542; }
  .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar .spacer { flex: 1; }

  label.switch { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; cursor: pointer; }
  label.switch input { accent-color: var(--accent); width: 16px; height: 16px; }
  input[type=range] { accent-color: var(--accent); width: 160px; }
  .update-line { color: var(--muted); margin: 6px 0; }
  .update-line b { color: var(--text); }
</style>
</head>
<body>
<header>
  <button data-tab="status" class="active">状态</button>
  <button data-tab="log">日志</button>
  <button data-tab="settings">设置</button>
</header>
<main>
  <section id="tab-status" class="active">
    <div class="card">
      <h3>dsh 服务</h3>
      <div class="row"><span class="label">状态</span><span id="phase" class="badge idle">…</span></div>
      <div class="row"><span class="label">端口</span><span id="port">—</span></div>
      <div class="row"><span class="label">进程 PID</span><span id="pid">—</span></div>
      <div class="row"><span class="label">重启次数</span><span id="restarts">0</span></div>
      <div class="row"><span class="label">已运行</span><span id="uptime">—</span></div>
      <div class="row"><span class="label">最近错误</span><span id="last-error" style="color:var(--err);word-break:break-all">—</span></div>
    </div>
    <div class="card">
      <h3>更新</h3>
      <div class="update-line" id="update-state">正在读取…</div>
      <div class="toolbar">
        <button id="btn-check-update">检查更新</button>
        <button id="btn-download-update" class="primary" style="display:none">下载并安装</button>
        <button id="btn-install-update" class="primary" style="display:none">重启以安装</button>
      </div>
    </div>
  </section>
  <section id="tab-log">
    <div class="toolbar">
      <button id="btn-clear-log">清空视图</button>
      <button id="btn-scroll-log" class="primary">跟随最新</button>
      <span class="spacer"></span>
      <span style="color:var(--muted)" id="log-count"></span>
    </div>
    <div id="log"></div>
  </section>
  <section id="tab-settings">
    <div class="card">
      <h3>应用</h3>
      <label class="switch"><span>关闭到托盘（常驻后台）</span><input type="checkbox" id="set-close-to-tray"></label>
      <label class="switch"><span>开机自启</span><input type="checkbox" id="set-auto-launch"></label>
    </div>
    <div class="card">
      <h3>关于</h3>
      <div class="update-line">DeepHarness Desktop <b id="about-version">…</b> · 非官方 DeepSeek Harness 桌面发行版</div>
    </div>
  </section>
</main>
<script type="module" src="./panel.mjs"></script>
</body>
</html>
