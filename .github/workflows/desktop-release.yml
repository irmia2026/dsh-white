# Desktop release pipeline: tag `desktop-v*` (or manual dispatch) builds the
# three platform installers and publishes them to a GitHub Release.
# `upstream-watch.yml` also calls this workflow (workflow_call) whenever the
# upstream deepseek-harness repo publishes a new release.
#
# The desktop project lives as an untracked directory inside the
# deepseek-harness checkout, so this workflow checks out both repos: the
# harness (source of the dsh runtime) and this desktop repo (the shell), then
# builds inside the harness tree.
#
# NOTE: this workflow is written but not yet run end-to-end; treat the first
# green run as the acceptance test.

name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Desktop version to publish (e.g. 0.1.1). Defaults to the triggering tag name.'
        required: false
        type: string
      upstream_ref:
        description: 'Harness git ref to build from (e.g. dsh-v0.1.1-rc.2). Defaults to the harness default branch.'
        required: false
        type: string
      desktop_ref:
        description: 'Desktop repo ref/sha to build and to target the release at. Defaults to the triggering ref.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            artifact: DshWhite-*-Setup.exe
          - os: ubuntu-latest
            args: --linux
            artifact: DshWhite-*.AppImage
          - os: macos-latest
            args: --mac
            artifact: DshWhite-*.dmg
    runs-on: ${{ matrix.os }}
    env:
      PRIMARY_NODE_VERSION: '24'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness
          ref: ${{ inputs.upstream_ref || '' }}

      - uses: actions/checkout@v6
        with:
          path: harness/desktop
          ref: ${{ inputs.desktop_ref || '' }}

      # pnpm/action-setup resolves its version from the checked-out repo's
      # package.json — which is the desktop repo here (no packageManager
      # field), so pin the version the harness workspace pins.
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      # Build the harness (the staged closure is materialized from built output).
      - name: Install harness dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: Build harness
        working-directory: harness
        run: pnpm run build

      # Desktop shell deps (npm; the repo .npmrc points at npmmirror, and the
      # electron binary is mirrored through ELECTRON_MIRROR on the runner).
      - name: Install desktop dependencies
        working-directory: harness/desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install

      # npm does not always run electron's install.js (observed locally and on
      # runners), leaving dist/electron absent; fetch it explicitly and verify
      # at the platform-correct path (darwin: Electron.app/Contents/MacOS/Electron).
      - name: Fetch electron binary
        working-directory: harness/desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node scripts/fetch-electron.mjs

      - name: Materialize dsh closure
        working-directory: harness/desktop
        run: node scripts/materialize.mjs

      - name: Boot smoke
        working-directory: harness/desktop
        run: node scripts/smoke-boot.mjs

      - name: Package
        working-directory: harness/desktop
        run: npx electron-builder ${{ matrix.args }} -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ runner.os }}
          path: |
            harness/desktop/release/*.exe
            harness/desktop/release/*.dmg
            harness/desktop/release/*.AppImage
            harness/desktop/release/*.deb
            harness/desktop/release/latest*.yml
            harness/desktop/release/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create needs a git repository context.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.desktop_ref || '' }}

      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || '' }}
          DESKTOP_REF: ${{ inputs.desktop_ref || '' }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#desktop-v}}"
          TAG="desktop-v${VERSION}"
          ARGS=(--title "Dsh-white v${VERSION}")
          if [ -n "$UPSTREAM_REF" ]; then
            ARGS+=(--notes "Bundles [deepseek-harness ${UPSTREAM_REF}](https://github.com/deepseek-ai/deepseek-harness/releases/tag/${UPSTREAM_REF}).")
          else
            ARGS+=(--generate-notes)
          fi
          if [ -n "$DESKTOP_REF" ]; then
            ARGS+=(--target "$DESKTOP_REF")
          fi
          gh release create "$TAG" dist/desktop-*/* "${ARGS[@]}"
