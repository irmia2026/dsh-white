appId: com.dshwhite.desktop
productName: Dsh-white
copyright: Unofficial community build of DeepSeek Harness

directories:
  output: release
  buildResources: build-resources

files:
  - electron/**/*
  - ui/**/*
  - assets/**/*
  - package.json

asar: true

# The dsh runtime closure is copied by the afterPack hook (scripts/after-pack.cjs):
# extraResources applies the default node_modules exclusions and would silently
# drop the closure's dependency tree.
afterPack: scripts/after-pack.cjs

# Auto-update channel: GitHub Releases (electron-updater reads latest.yml).
# Change owner/repo to wherever this project is pushed.
publish:
  - provider: github
    owner: irmia2026
    repo: dsh-white

win:
  target:
    - nsis
    - portable
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: DshWhite-${version}-Setup.${ext}

portable:
  artifactName: DshWhite-${version}-Portable.${ext}

mac:
  target:
    - dmg
    - zip
  identity: null
  category: public.app-category.developer-tools
  icon: build-resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build-resources/icon.png
