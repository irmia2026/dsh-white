appId: com.deepharness.desktop
productName: DeepHarness Desktop
copyright: Unofficial community build of DeepSeek Harness

directories:
  output: release
  buildResources: build-resources

files:
  - electron/**/*
  - ui/**/*
  - assets/**/*
  - package.json

asar: true

extraResources:
  - from: .staging/dsh
    to: dsh

# Auto-update channel: GitHub Releases (electron-updater reads latest.yml).
# Change owner/repo to wherever this project is pushed.
publish:
  - provider: github
    owner: irmia2026
    repo: deepharness-desktop

win:
  target:
    - nsis
    - portable
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: DeepHarnessDesktop-${version}-Setup.${ext}

portable:
  artifactName: DeepHarnessDesktop-${version}-Portable.${ext}

mac:
  target:
    - dmg
    - zip
  identity: null
  category: public.app-category.developer-tools
  icon: build-resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build-resources/icon.png
